<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #7f0101);
            color: white;
            text-align: center;
            padding: 40px;
            font-size: 28px;
        }
        h1 {
            font-size: 3.5rem;
            color: #facc15;
            text-shadow: 2px 2px #dc2626;
        }
        button {
            background: #dc2626;
            color: aquamarine;
            border: rgb(127, 83, 0);
            font-size: 1em;
            padding: 18px 30px;
            border-radius: 12px;
        }
        button:hover {
            background: #facc15;
            color: firebrick;
        }
        #timer {
          display: inline-block;
          font-size: 2.5rem;
          font-weight: bold;
          font-variant-numeric: tabular-nums;
          color: #facc15;
          background: rgba(0, 0, 0, 0.45);
          border: 3px solid #facc15;
          border-radius: 16px;
          padding: 8px 28px;
          margin: 0 0 30px;
          position: relative;
          z-index: 1;
        }
        .quiz-container {
          position: relative;
          display: grid;
          grid-template-columns: minmax(0, 700px);
          justify-content: center;
        }
        .quiz-left {
          position: relative;
          z-index: 1;
        }
        .quiz-right {
          position: absolute;
          top: 0;
          right: 0;
          z-index: 0;
        }
        .corner-left {
          position: fixed;
          left: 0;
          bottom: 0;
          width: 40vw;
          max-width: 800px;
          z-index: 0;
          pointer-events: none;
        }
        .quiz-right img {
          width: 40vw;
          max-width: 800px;
          border-radius: 12px
        }
        @media (max-width: 768px) {
          body {
            padding: 16px;
            font-size: 18px;
          }
          h1 {
            font-size: 1.9rem;
          }
          #timer {
            font-size: 1.6rem;
            padding: 6px 20px;
            margin-bottom: 20px;
          }
          button {
            padding: 14px 20px;
            margin: 6px 4px;
          }
          .quiz-right {
            position: static;
            margin-top: 20px;
          }
          .quiz-right img {
            width: 80vw;
            max-width: 400px;
          }
          .corner-left {
            width: 45vw;
            opacity: 0.35;
          }
        }
    </style>
</head>
<body>
   <img class="corner-left" src="draconusjay.png" alt="Dragon Jay flying with ice wings">
   <h1>NINJAGO SUPER QUIZZ</h1>
   <p id="timer">Time: 10</p>
   <div class="quiz-container">
    <div class="quiz-left">
   <div id="question1">
   <p>who is the green ninja?</p>
   <button onclick="checkAnswer('LLOYD')">LLOYD</button>
   <button onclick="checkAnswer('FRAK')">FRAK</button>
   <P id="result"></P>
   </div>
   <div id="question2" style="display:none;">
   <p>who was the elemental master of smoke in 2025 ?</p>
   <button onclick="checkAnswer2('CINDER')">CINDER</button>
   <button onclick="checkAnswer2('ASH')">ASH</button>
   <p id="result2"></p>
   </div>
    <div id="question3" style="display:none;">
   <p>what is the name of dereth's dojo ?</p>
   <button onclick="checkAnswer3('MOJO DOJO')">MOJO DOJO
   </button>
   <button onclick="checkAnswer3('BROWN DOJO')">BROWN DOJO</button>
   <p id="result3"></p>
   </div>
   <div id="question4" style="display:none;">
   <p>who is kai's and nya's mother ?</p>
   <button onclick="checkAnswer4('MAYA')">MAYA
   </button>
   <button onclick="checkAnswer4('LILY')">LILY</button>
   <p id="result4"></p>
   </div>
    <div id="question5" style="display:none;">
   <p>who is the new character that is related to Lord Ras's tribe ?</p>
   <button onclick="checkAnswer5('ZILVAR')">ZILVAR
   </button>
   <button onclick="checkAnswer5('YOUNG ZERAS')">YOUNG ZERAS</button>
   <p id="result5"></p>
   </div>
   <div id="finalScore" style="display: none;">
    <h2>Your Score: <span id="scoreText"></span>/5</h2>
   </div>
   </div>
   <div class="quiz-right">
    <img src="pic.png" alt="LLOYD the legendary green ninja?">
   </div>
   </div>
   <script>
    let score = 0;
    let current = 1;
    const TIME_LIMIT = 10;
    let timeLeft = TIME_LIMIT;
    let timerId;
    function showTime() {
      document.getElementById('timer').textContent = 'Time: ' + timeLeft;
    }
    function startTimer() {
      clearInterval(timerId);
      timeLeft = TIME_LIMIT;
      showTime();
      timerId = setInterval(() => {
        timeLeft--;
        showTime();
        if (timeLeft <= 0) goToNext();
      }, 1000);
    }
    function finishQuiz() {
      clearInterval(timerId);
      document.getElementById('finalScore').style.display = 'block';
      document.getElementById('scoreText').textContent = score;
    }
    function goToNext() {
      document.getElementById('question' + current).style.display = 'none';
      if (current === 5) {
        finishQuiz();
        return;
      }
      current++;
      document.getElementById('question' + current).style.display = 'block';
      startTimer();
    }
    function checkAnswer(choice) {
      document.getElementById('result').textContent = choice === 'LLOYD' ? 'Correct! 🥷🏻' : 'Nope, try again!';
      if (choice === 'LLOYD') {
        score = score + 1;
        goToNext();
      }
    }
    function checkAnswer2(choice) {
      document.getElementById('result2').textContent = choice === 'CINDER' ? 'CORRECT! 💨' : 'NOPE, TRY AGAIN!';
      if (choice === 'CINDER') {
        score = score + 1;
        goToNext();
      }
    }
    function checkAnswer3(choice) {
      document.getElementById('result3').textContent = choice === 'MOJO DOJO' ? 'CORRECT! 🟫' : 'NOPE, TRY AGAIN!';
      if (choice === 'MOJO DOJO') {
        score = score + 1;
        goToNext();
      }
    }
    function checkAnswer4(choice) {
      document.getElementById('result4').textContent = choice === 'MAYA' ? 'CORRECT! 💧' : 'NO, thats Cole\'s mother.';
      if (choice === 'MAYA') {
        score = score + 1;
        goToNext();
      }
    }
    function checkAnswer5(choice) {
      document.getElementById('result5').textContent = choice === 'ZILVAR' ? 'CORRECT! 🐯🩶' : 'WRONG! THATS LORD RAS\'S NAME.';
      if (choice === 'ZILVAR') {
        score = score + 1;
      }
      goToNext();
    }
    startTimer();
   </script>
</body>
</html>
